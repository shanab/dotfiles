# herdr configuration (Mac client + local server). Stowed to ~/.config/herdr/config.toml
# Keep [keys] identical to dotfiles-linux/herdr/config.toml so Mac and CDD panes behave the same.
# After edits: herdr server reload-config

onboarding = false

[keys]
# Prefix for all herdr commands (ctrl+a, like the old Mac tmux prefix). Shared with dotfiles-linux.
prefix = "ctrl+a"

# Back-and-forth to the last focused pane across tabs and workspaces (like tmux last-window/last-session).
last_pane = "prefix+a"
# Settings moved off prefix+s so s can split, as in tmux.
settings = "prefix+comma"
# Split down on prefix+s (tmux muscle memory); prefix+minus left unbound.
split_horizontal = "prefix+s"

# Fuzzy workspace:tab picker across all machines (prefix+f). Script lives next to this file.
[[keys.command]]
key = "prefix+f"
type = "popup"
command = "~/.config/herdr/herdr-pick"
width = "70%"
height = "70%"

[terminal]
new_cwd = "follow"

[ui.toast]
# macOS notification when a background agent finishes or needs attention.
delivery = "system"
delay_seconds = 1

[ui.sound]
enabled = true

[session]
resume_agents_on_restore = true
startup_per_agent_delay_ms = 250

[remote]
# cdd alias uses a wssh ProxyCommand; use ~/.ssh/config as is.
manage_ssh_config = false

[experimental]
pane_history = true

[ui]
status_indicators = "symbols"
